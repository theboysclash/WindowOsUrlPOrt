name: Windows exe

on:
  push:
    branches: [main, cursor/vm-web-server-b15e]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Build vmserver.exe
        run: go build -trimpath -ldflags "-s -w" -o vmserver.exe ./cmd/vmserver
        env:
          CGO_ENABLED: "0"
      - uses: actions/upload-artifact@v4
        with:
          name: vmserver-windows-amd64
          path: vmserver.exe
